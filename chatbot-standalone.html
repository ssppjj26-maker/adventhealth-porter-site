<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olivia · Virtual Assistant (Standalone)</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- n8n Chat Widget Stylesheet -->
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />

  <style>
    /* ==========================================================================
       RESET & BASE STYLES
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0d1e38;
      background: radial-gradient(circle at 50% 20%, #1a3c68 0%, #08172c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================================
       CHAT WINDOW CONTAINER
       ========================================================================== */
    .chat-window {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 94vh;
      max-height: 760px;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      z-index: 9998;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45), 0 5px 20px rgba(0, 55, 100, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      margin: auto;
    }

    @keyframes chatOpen {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ==========================================================================
       CHAT HEADER
       ========================================================================== */
    .chat-header {
      background: linear-gradient(135deg, #003764, #005a96, #0076c0);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
    }

    .assistant-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .assistant-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 11px;
      display: block;
    }

    .avatar-status {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #6cc04a;
      border-radius: 50%;
      border: 2px solid white;
      right: -2px;
      bottom: -2px;
    }

    .assistant-name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
    }

    .assistant-subtitle {
      margin-top: 4px;
      color: #d8efff;
      font-size: 11px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: #d8efff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: white;
    }

    /* ==========================================================================
       CHAT BODY
       ========================================================================== */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 15px;
      background: #f8fafc;
      scroll-behavior: smooth;
    }

    .chat-body::-webkit-scrollbar {
      width: 5px;
    }

    .chat-body::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 20px;
    }

    /* ==========================================================================
       MESSAGES
       ========================================================================== */
    .message-row {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
      animation: messageAppear 0.2s ease forwards;
    }

    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-row.bot {
      align-items: flex-start;
      text-align: left;
    }

    .message-row.user {
      align-items: flex-end;
      text-align: right;
    }

    .message-meta {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 0 6px;
      margin-bottom: 5px;
      color: #94a3b8;
      font-size: 10px;
    }

    .message {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.55;
      text-align: left;
      word-break: break-word;
    }

    .bot-message {
      background: white;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      border-top-left-radius: 4px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .bot-message a {
      color: #0076c0;
      font-weight: 600;
      text-decoration: underline;
    }

    .user-message {
      background: #0076c0;
      color: white;
      border-top-right-radius: 4px;
      font-weight: 500;
    }

    /* ==========================================================================
       QUICK ACTION BUTTONS
       ========================================================================== */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
      max-width: 90%;
    }

    .quick-button {
      background: white;
      color: #003764;
      border: 1px solid #dbe3eb;
      padding: 8px 11px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
      font-family: inherit;
    }

    .quick-button:hover {
      border-color: #0076c0;
      background: #eff8ff;
      transform: translateY(-1px);
    }

    /* ==========================================================================
       TYPING INDICATOR
       ========================================================================== */
    .typing {
      display: none;
      align-items: center;
      gap: 7px;
      color: #94a3b8;
      font-size: 11px;
      padding: 5px;
    }

    .typing.active {
      display: flex;
    }

    .typing-dots {
      display: flex;
      gap: 3px;
    }

    .typing-dots span {
      width: 5px;
      height: 5px;
      background: #0076c0;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* ==========================================================================
       INPUT AREA
       ========================================================================== */
    .chat-input-area {
      padding: 12px;
      background: white;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 11px 13px;
      outline: none;
      font-size: 12px;
      color: #1e293b;
      font-family: inherit;
      transition: 0.2s;
    }

    .chat-input:focus {
      border-color: #0076c0;
      box-shadow: 0 0 0 3px rgba(0, 118, 192, 0.08);
    }

    .chat-input::placeholder {
      color: #94a3b8;
    }

    .send-button {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: 12px;
      background: #0076c0;
      color: white;
      cursor: pointer;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .send-button:hover {
      background: #005a96;
      transform: translateY(-1px);
    }

    /* ==========================================================================
       FOOTER
       ========================================================================== */
    .chat-footer {
      padding: 8px 12px;
      background: #f8fafc;
      border-top: 1px solid #eef2f7;
      display: flex;
      justify-content: center;
      color: #64748b;
      font-size: 10px;
      text-align: center;
    }

    .chat-footer strong {
      color: #334155;
    }

    /* ==========================================================================
       FLOATING CHAT LAUNCHER BUTTON (FALLBACK IF MINIMIZED)
       ========================================================================== */
    .chat-launcher {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .launcher-label {
      display: none;
    }

    .launcher-button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid rgba(108, 192, 74, 0.5);
      background: linear-gradient(135deg, #003764, #005a96, #0076c0);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0, 55, 100, 0.3);
      transition: 0.25s ease;
      position: relative;
    }

    .launcher-button:hover {
      transform: translateY(-2px);
    }

    .launcher-icon {
      font-size: 26px;
    }

    .online-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 12px;
      height: 12px;
      background: #6cc04a;
      border: 2px solid white;
      border-radius: 50%;
    }

    /* ==========================================================================
       MOBILE RESPONSIVENESS
       ========================================================================== */
    @media (max-width: 600px) {
      html, body {
        background: #0d1e38;
      }

      .chat-launcher {
        right: 12px;
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100vw - 24px);
        z-index: 9999;
      }

      .launcher-label {
        display: inline-flex !important;
        align-items: center;
        background: #003764;
        color: #ffffff;
        font-size: 12.5px;
        font-weight: 700;
        padding: 8px 13px;
        border-radius: 999px;
        box-shadow: 0 4px 14px rgba(0, 55, 100, 0.35);
        white-space: nowrap;
        border: 1.5px solid rgba(108, 192, 74, 0.7);
        cursor: pointer;
        animation: pulseLabel 3s infinite ease-in-out;
      }

      .launcher-button {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .chat-window {
        position: fixed !important;
        top: max(22px, env(safe-area-inset-top)) !important;
        bottom: max(22px, env(safe-area-inset-bottom)) !important;
        left: 12px !important;
        right: 12px !important;
        width: auto !important;
        max-width: calc(100vw - 24px) !important;
        height: auto !important;
        max-height: calc(100dvh - 44px) !important;
        border-radius: 12px !important;
        overflow: hidden !important;
        border: 1px solid rgba(0, 55, 100, 0.15) !important;
        box-shadow: 0 16px 45px rgba(0, 31, 59, 0.4) !important;
        margin: 0 !important;
      }

      .chat-header {
        padding: 13px 15px;
      }

      .chat-header .assistant-name {
        font-size: 15px !important;
        font-weight: 700 !important;
      }

      .chat-header .assistant-subtitle {
        font-size: 12px !important;
      }

      .chat-body {
        padding: 14px 12px;
      }

      .chat-body .message {
        font-size: 14.5px !important;
        line-height: 1.5 !important;
        padding: 10px 14px !important;
      }

      .chat-input-area {
        padding: 10px 12px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }

      .chat-input {
        font-size: 15px !important;
        padding: 11px 13px !important;
      }

      .chat-footer {
        font-size: 11px !important;
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>


  <!-- ==========================================================================
       CHAT WINDOW
       ========================================================================== -->
  <div class="chat-window" id="chatWindow" role="complementary" aria-label="Virtual Assistant Chat">

    <!-- HEADER -->
    <div class="chat-header">
      <div class="header-left">
        <div class="assistant-avatar">
          <img
            src="https://media.easy-peasy.ai/64e6deed-a575-4435-b72b-690ea4499d25/0a29323f-7861-495a-b4a8-b77fd1a810d5_medium.webp" />
          <span class="avatar-status"></span>
        </div>
        <div>
          <div class="assistant-name">Olivia · Virtual Assistant</div>
          <div class="assistant-subtitle">Appointment Scheduling</div>
        </div>
      </div>

      <div class="header-actions">
        <button class="header-btn" id="restartChatBtn" title="Restart conversation">↻</button>
        <button class="header-btn" title="Close" onclick="toggleChat()">✕</button>
      </div>
    </div>






    <!-- CHAT BODY -->
    <div class="chat-body" id="chatBody">

      <!-- TYPING INDICATOR -->
      <div class="typing" id="typingIndicator">
        <div class="typing-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span>Olivia is typing...</span>
      </div>

    </div>

    <!-- INPUT AREA -->
    <div class="chat-input-area">
      <input class="chat-input" id="chatInput" type="text" placeholder="Type your message here..." />
      <button class="send-button" id="sendButton" aria-label="Send message">
        ➤
      </button>
    </div>

    <!-- FOOTER -->
    <div class="chat-footer">
      🔒 Your information is handled securely&nbsp; · &nbsp;
      <strong>Emergency? Call 911</strong>
    </div>

  </div>


  <!-- ==========================================================================
       FLOATING CHAT LAUNCHER BUTTON
       ========================================================================== -->
  <div class="chat-launcher">
    <div class="launcher-label" onclick="toggleChat()">
      Book Appointment Here!
    </div>
    <button class="launcher-button" onclick="toggleChat()" aria-label="Open chat">
      <span class="launcher-icon">💬</span>
      <span class="online-dot"></span>
    </button>
  </div>


  <!-- ==========================================================================
       INTELLIGENT CHATBOT JAVASCRIPT ENGINE
       ========================================================================== -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initChatbot();
    });

    function initChatbot() {
      const chatWindow = document.getElementById("chatWindow");
      const chatBody = document.getElementById("chatBody");
      const chatInput = document.getElementById("chatInput");
      const sendButton = document.getElementById("sendButton");
      const restartButton = document.getElementById("restartChatBtn");

      // Reset chat to empty state
      window.resetChat = function () {
        chatBody.innerHTML = `
          <div class="typing" id="typingIndicator">
            <div class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <span>Olivia is typing...</span>
          </div>
        `;
      };

      // Toggle chat window open / closed
      window.toggleChat = function () {
        chatWindow.classList.toggle("active");
        if (chatWindow.classList.contains("active")) {
          setTimeout(() => {
            chatInput.focus();
            scrollToBottom();
          }, 250);
        }
      };

      // Handle sending text
      function handleSendMessage() {
        const query = chatInput.value.trim();
        if (!query) return;

        addUserMessage(query);
        chatInput.value = "";
      }

      sendButton.addEventListener("click", handleSendMessage);
      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleSendMessage();
        }
      });

      if (restartButton) {
        restartButton.addEventListener("click", () => {
          window.resetChat();
        });
      }

      // Append user message (clean message bubble, no time code)
      function addUserMessage(text) {
        const userRow = document.createElement("div");
        userRow.className = "message-row user";
        userRow.innerHTML = `
          <div class="message user-message">${escapeHTML(text)}</div>
        `;

        const typing = document.getElementById("typingIndicator");
        if (typing) {
          chatBody.insertBefore(userRow, typing);
        } else {
          chatBody.appendChild(userRow);
        }
        scrollToBottom();
      }

      // Optional helper to append bot message (only when called externally, not automatic)
      window.addBotMessage = function(htmlContent) {
        const botRow = document.createElement("div");
        botRow.className = "message-row bot";
        botRow.innerHTML = `
          <div class="message bot-message">${htmlContent}</div>
        `;

        const typing = document.getElementById("typingIndicator");
        if (typing) {
          chatBody.insertBefore(botRow, typing);
        } else {
          chatBody.appendChild(botRow);
        }
        scrollToBottom();
      };

      function scrollToBottom() {
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      function escapeHTML(str) {
        const div = document.createElement("div");
        div.innerText = str;
        return div.innerHTML;
      }
    }
  </script>

  <!-- n8n Chat Integration -->
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    createChat({
        webhookUrl: 'https://spartamax.app.n8n.cloud/webhook/c00eb95f-55c9-4fec-a382-b252dc5962aa/chat'
    });
  </script>

</body>

</html>
